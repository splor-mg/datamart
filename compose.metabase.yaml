# Um item Compose no Easypanel: Metabase + seu banco interno PostgreSQL.
# O PostgreSQL analítico datamart-postgres continua separado.
name: datamart-metabase

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${METABASE_POSTGRES_ADMIN_PASSWORD:?Defina METABASE_POSTGRES_ADMIN_PASSWORD}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:?Defina METABASE_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      TZ: America/Sao_Paulo
    # Gera o bootstrap dentro do container, sem bind mounts de código da VM.
    # O entrypoint oficial só executa o bootstrap quando o volume está vazio.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        cat > /docker-entrypoint-initdb.d/10-metabase.sh <<'INIT'
        #!/bin/sh
        set -eu
        psql --set ON_ERROR_STOP=1 --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}" <<'SQL'
        \getenv app_password METABASE_DB_PASSWORD
        CREATE ROLE metabase LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'app_password';
        CREATE DATABASE metabase OWNER metabase ENCODING 'UTF8' TEMPLATE template0;
        REVOKE ALL ON DATABASE metabase FROM PUBLIC;
        \connect metabase
        REVOKE CREATE ON SCHEMA public FROM PUBLIC;
        GRANT USAGE, CREATE ON SCHEMA public TO metabase;
        SQL
        INIT
        chmod 755 /docker-entrypoint-initdb.d/10-metabase.sh
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - --
    command: [postgres]
    volumes:
      - metabase_db_data:/var/lib/postgresql/data
    networks:
      - application_db
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  metabase:
    image: metabase/metabase:v0.64.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?Defina METABASE_DB_PASSWORD}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_SECRET_KEY:?Defina METABASE_ENCRYPTION_SECRET_KEY}
      MB_SITE_URL: ${METABASE_SITE_URL:?Defina METABASE_SITE_URL}
      JAVA_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    expose:
      - "3000"
    networks:
      - application_db
      - easypanel
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:3000/api/health]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

volumes:
  metabase_db_data:

networks:
  application_db:
    internal: true
  easypanel:
    external: true
    # Confirme o nome real da rede compartilhada na VM antes de implantar.
    name: ${EASYPANEL_NETWORK:?Defina EASYPANEL_NETWORK com a rede Docker compartilhada do projeto}
