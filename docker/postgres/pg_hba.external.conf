# Sockets internos permitem inicialização e manutenção dentro do container.
local all all trust

# Conexões TCP, inclusive do Metabase, exigem TLS e senha SCRAM.
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
hostssl all all 0.0.0.0/0 scram-sha-256
hostssl all all ::/0 scram-sha-256
